name: Build, push and deploy
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  docker-lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@v1.12.0
  maven-verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      # nodejs is needed because the dynamic download of it via the prettier maven plugin often
      # times out
      # Example: https://github.com/opentripplanner/OpenTripPlanner/actions/runs/4490450225/jobs/7897533439
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: 21.0.1+12
          distribution: liberica
          cache: 'maven'
      - run: |
          mvn verify -Dprettier.nodePath=node -Dprettier.npmPath=npm
      - run: |
          mvn \
            org.jacoco:jacoco-maven-plugin:prepare-agent verify \
            org.jacoco:jacoco-maven-plugin:report sonar:sonar \
            -P prettierSkip \
            -Dmaven.main.skip \
            -DskipTests \
            -Dsonar.projectKey=entur_enlil \
            -Dsonar.organization=enturas-github \
            -Dsonar.projectName=enlil \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.ENTUR_SONAR_PASSWORD }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          path: target/*.jar
  docker-build:
    needs: [docker-lint, maven-verify]
    uses: entur/gha-docker/.github/workflows/build.yml@v1.12.0
    with:
      build_artifact_name: artifact
      build_artifact_path: target
  docker-push:
    if: github.repository_owner == 'entur' && github.event_name == 'push'
    needs: [docker-build]
    uses: entur/gha-docker/.github/workflows/push.yml@v1.12.0

  helm-lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Helm lint against every env values file
        run: |
          for env in dev tst prd; do
            helm lint helm/enlil -f helm/enlil/env/values-kub-ent-${env}.yaml
          done

  terraform-lint:
    uses: entur/gha-terraform/.github/workflows/lint.yml@v2.5.0

  tf-plan-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs: [ terraform-lint, docker-push ]
    name: Terraform Plan DEV
    uses: entur/gha-terraform/.github/workflows/plan.yml@v2.5.0
    with:
      environment: dev

  tf-approval-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-dev.outputs.has_changes == 'true' }}
    needs: [ tf-plan-dev ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve DEV tf plan"

  tf-apply-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-dev.outputs.has_changes == 'true' }}
    needs: [ tf-plan-dev, tf-approval-dev ]
    name: Terraform Apply DEV
    uses: entur/gha-terraform/.github/workflows/apply.yml@v2.5.0
    with:
      environment: dev
      has_changes: ${{ needs.tf-plan-dev.outputs.has_changes }}

  deploy-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ helm-lint, tf-plan-dev, tf-apply-dev, docker-push ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v2.0.0
    with:
      environment: dev
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/enlil
      image_set_path: "image.identifier"
      namespace: enlil
      release_name: enlil
    secrets: inherit

  approval-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ deploy-dev, helm-lint, tf-plan-dev, tf-apply-dev, docker-push ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve TST deployment"


  tf-plan-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs: [ terraform-lint, approval-tst ]
    name: Terraform Plan TST
    uses: entur/gha-terraform/.github/workflows/plan.yml@v2.5.0
    with:
      environment: tst

  tf-approval-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-tst.outputs.has_changes == 'true' }}
    needs: [ tf-plan-tst ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve TST tf plan"

  tf-apply-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-tst.outputs.has_changes == 'true' }}
    needs: [ tf-plan-tst, tf-approval-tst ]
    name: Terraform Apply TST
    uses: entur/gha-terraform/.github/workflows/apply.yml@v2.5.0
    with:
      environment: tst
      has_changes: ${{ needs.tf-plan-tst.outputs.has_changes }}


  deploy-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ approval-tst, tf-plan-tst, tf-apply-tst, docker-push ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v2.0.0
    with:
      environment: tst
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/enlil
      image_set_path: "image.identifier"
      namespace: enlil
      release_name: enlil
    secrets: inherit

  approval-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ deploy-tst, approval-tst, tf-plan-tst, tf-apply-tst, docker-push ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve PRD deployment"


  tf-plan-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs: [ terraform-lint, approval-prd ]
    name: Terraform Plan PRD
    uses: entur/gha-terraform/.github/workflows/plan.yml@v2.5.0
    with:
      environment: prd

  tf-approval-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-prd.outputs.has_changes == 'true' }}
    needs: [ tf-plan-prd ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve PRD tf plan"

  tf-apply-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tf-plan-prd.outputs.has_changes == 'true' }}
    needs: [ tf-plan-prd, tf-approval-prd ]
    name: Terraform Apply PRD
    uses: entur/gha-terraform/.github/workflows/apply.yml@v2.5.0
    with:
      environment: prd
      has_changes: ${{ needs.tf-plan-prd.outputs.has_changes }}


  deploy-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ approval-prd, tf-plan-prd, tf-apply-prd, docker-push ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v2.0.0
    with:
      environment: prd
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/enlil
      image_set_path: "image.identifier"
      namespace: enlil
      release_name: enlil
    secrets: inherit

name: Build, push and deploy
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  docker-lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@v1
  maven-verify:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # nodejs is needed because the dynamic download of it via the prettier maven plugin often
      # times out
      # Example: https://github.com/opentripplanner/OpenTripPlanner/actions/runs/4490450225/jobs/7897533439
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Same JDK as the distroless runtime image (Temurin). check-latest skips the runner's
      # cached JDK, which can lag behind.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
          check-latest: true
          cache: 'maven'
      - run: |
          mvn verify -Dprettier.nodePath=node -Dprettier.npmPath=npm
      # Dependabot PRs don't get Actions secrets, so the Sonar token is empty there
      - name: Sonar scan
        if: github.actor != 'dependabot[bot]'
        run: |
          mvn \
            org.jacoco:jacoco-maven-plugin:prepare-agent verify \
            org.jacoco:jacoco-maven-plugin:report sonar:sonar \
            -P prettierSkip \
            -Dmaven.main.skip \
            -DskipTests \
            -Dsonar.projectKey=entur_enlil \
            -Dsonar.organization=enturas-github \
            -Dsonar.projectName=enlil \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.ENTUR_SONAR_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/*.jar
  docker-smoke:
    needs: [maven-verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact
          path: target
      - run: docker build -t enlil:smoke .
      # Nothing else in CI runs the image. Reaching Spring's startup line proves the JRE loaded the
      # application bytecode; it then fails on config that only exists in the cluster, which is fine.
      # A wrong class file version or an unusable base image never gets that far.
      - run: |
          timeout 180 docker run --rm enlil:smoke 2>&1 | tee smoke.log || true
          grep -q "using Java" smoke.log
  docker-build:
    needs: [docker-lint, maven-verify]
    uses: entur/gha-docker/.github/workflows/build.yml@v1
    with:
      build_artifact_name: artifact
      build_artifact_path: target
  docker-push:
    if: github.repository_owner == 'entur' && github.event_name == 'push'
    needs: [docker-build, docker-smoke]
    uses: entur/gha-docker/.github/workflows/push.yml@v1

  helm-lint:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Helm lint against every env values file
        run: |
          for env in dev tst prd; do
            helm lint helm/enlil -f helm/enlil/env/values-kub-ent-${env}.yaml
          done

  terraform-lint:
    uses: entur/gha-terraform/.github/workflows/lint.yml@v3

  tf-plan-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs: [ terraform-lint, docker-push ]
    name: Terraform Plan DEV
    uses: entur/gha-terraform/.github/workflows/plan.yml@v3
    with:
      environment: dev

  tf-approval-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.tf-plan-dev.outputs.has_changes == 'true' }}
    needs: [ tf-plan-dev ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve DEV tf plan"

  tf-apply-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.tf-plan-dev.outputs.has_changes == 'true' }}
    needs: [ tf-plan-dev, tf-approval-dev ]
    name: Terraform Apply DEV
    uses: entur/gha-terraform/.github/workflows/apply.yml@v3
    with:
      environment: dev
      has_changes: ${{ needs.tf-plan-dev.outputs.has_changes }}

  deploy-dev:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ helm-lint, tf-plan-dev, tf-apply-dev, docker-push ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v2
    with:
      environment: dev
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/enlil
      image_set_path: "image.identifier"
      namespace: enlil
      release_name: enlil
    secrets: inherit

  # Once this commit is in dev, older master runs still parked at an approval gate are
  # superseded. Runs that are actively deploying (in_progress) are left alone.
  cancel-superseded:
    if: ${{ !cancelled() && needs.deploy-dev.result == 'success' && github.event_name == 'push' }}
    needs: [ deploy-dev ]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel older runs waiting for approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list -R "$GITHUB_REPOSITORY" --workflow push.yml --branch master \
            --status waiting --limit 100 --json databaseId \
            --jq ".[] | select(.databaseId < $GITHUB_RUN_ID) | .databaseId" |
            while read -r id; do
              echo "Cancelling superseded run $id"
              gh run cancel "$id" -R "$GITHUB_REPOSITORY"
            done

  approval-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ deploy-dev, helm-lint, tf-plan-dev, tf-apply-dev, docker-push ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve TST deployment"


  tf-plan-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs: [ terraform-lint, approval-tst ]
    name: Terraform Plan TST
    uses: entur/gha-terraform/.github/workflows/plan.yml@v3
    with:
      environment: tst

  tf-approval-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.tf-plan-tst.outputs.has_changes == 'true' }}
    needs: [ tf-plan-tst ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve TST tf plan"

  tf-apply-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.tf-plan-tst.outputs.has_changes == 'true' }}
    needs: [ tf-plan-tst, tf-approval-tst ]
    name: Terraform Apply TST
    uses: entur/gha-terraform/.github/workflows/apply.yml@v3
    with:
      environment: tst
      has_changes: ${{ needs.tf-plan-tst.outputs.has_changes }}


  deploy-tst:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ approval-tst, tf-plan-tst, tf-apply-tst, docker-push ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v2
    with:
      environment: tst
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/enlil
      image_set_path: "image.identifier"
      namespace: enlil
      release_name: enlil
    secrets: inherit

  approval-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ deploy-tst, approval-tst, tf-plan-tst, tf-apply-tst, docker-push ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve PRD deployment"


  tf-plan-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs: [ terraform-lint, approval-prd ]
    name: Terraform Plan PRD
    uses: entur/gha-terraform/.github/workflows/plan.yml@v3
    with:
      environment: prd

  tf-approval-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.tf-plan-prd.outputs.has_changes == 'true' }}
    needs: [ tf-plan-prd ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Approve
    steps:
      - name: Manual approval
        shell: bash
        run: echo "Approve PRD tf plan"

  tf-apply-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.tf-plan-prd.outputs.has_changes == 'true' }}
    needs: [ tf-plan-prd, tf-approval-prd ]
    name: Terraform Apply PRD
    uses: entur/gha-terraform/.github/workflows/apply.yml@v3
    with:
      environment: prd
      has_changes: ${{ needs.tf-plan-prd.outputs.has_changes }}


  deploy-prd:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref == 'refs/heads/master' }}
    needs: [ approval-prd, tf-plan-prd, tf-apply-prd, docker-push ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v2
    with:
      environment: prd
      image: ${{ needs.docker-push.outputs.image_name }}:${{ needs.docker-push.outputs.image_tag}}
      chart: helm/enlil
      image_set_path: "image.identifier"
      namespace: enlil
      release_name: enlil
    secrets: inherit
